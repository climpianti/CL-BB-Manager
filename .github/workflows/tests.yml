name: CL BB Manager quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests
      - name: Validate JavaScript syntax
        run: node --check custom_components/cl_bb_manager/frontend/panel.js
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/cl_bb_manager/manifest.json > /dev/null
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Run pure-model tests
        run: python -m pytest tests -q
