name: CL BB Manager quality checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests
      - name: Validate JavaScript syntax
        run: node --check custom_components/cl_bb_manager/frontend/panel.js
      - name: Run frontend error-regression tests
        run: npm ci --ignore-scripts && node --test tests/test_panel.mjs
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/cl_bb_manager/manifest.json > /dev/null
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Run pure-model tests
        run: python -m pytest tests -q

  package:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Read component version
        run: echo "CL_BB_VERSION=$(python -c 'import json; print(json.load(open("custom_components/cl_bb_manager/manifest.json"))["version"])')" >> "$GITHUB_ENV"
      - name: Create integration ZIP
        run: zip -r "CL-BB-Manager-${CL_BB_VERSION}.zip" custom_components/cl_bb_manager -x '*.pyc' -x '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: CL-BB-Manager-${{ env.CL_BB_VERSION }}-install
          path: CL-BB-Manager-${{ env.CL_BB_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

